name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect Changes
    uses: ./.pai-universe/.github/workflows/reusable/detect-changes.yml
    with:
      github-token: ${{ github.token }}

  node-ci:
    name: Node CI
    needs: detect
    if: needs.detect.outputs.node == 'true' || needs.detect.outputs.mono == 'true'
    uses: ./.pai-universe/.github/workflows/reusable/node-ci.yml
    with:
      turbo-targets: "build test lint typecheck"
      working-directory: .
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  security-scan:
    name: Security Scan
    needs: detect
    uses: ./.pai-universe/.github/workflows/reusable/security-scan.yml
    with:
      working-directory: .
      language: "typescript"

  all-checks:
    name: All Checks Passed
    needs: [detect, node-ci, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          FAILED=0
          for job in node-ci security-scan; do
            RESULT="${{ needs.$job.result }}"
            if [[ "$RESULT" == "failure" || "$RESULT" == "cancelled" ]]; then
              echo "❌ $job: $RESULT"
              FAILED=1
            elif [[ "$RESULT" == "success" ]]; then
              echo "✅ $job: $RESULT"
            else
              echo "⏭️  $job: $RESULT (skipped)"
            fi
          done
          if [[ $FAILED -eq 1 ]]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          echo "✅ All checks passed"